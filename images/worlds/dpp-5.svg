<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112210"/>
      <stop offset="52%" stop-color="#1d381a"/>
      <stop offset="100%" stop-color="#2f562a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#90a955" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#90a955" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#4f772d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#162b14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c5e4a0" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8faf5"/>
      <stop offset="100%" stop-color="#eef5e6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- Decorative circular rings in top right -->
  <g transform="translate(1030, 140)" opacity="0.22" fill="none" stroke="#c5e4a0">
    <circle r="190" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle r="145" stroke-width="1.5"/>
    <circle r="98" stroke-width="2" stroke-dasharray="3 6"/>
    <circle r="48" stroke-width="1.5" fill="#90a955" fill-opacity="0.18"/>
  </g>

  <!-- Browser / Cockpit Window Frame -->
  <g transform="translate(56, 46)">
    <rect width="1088" height="583" rx="22" fill="#162b14" fill-opacity="0.82" stroke="#90a955" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Top Browser Bar -->
    <rect width="1088" height="54" rx="22" fill="#0f1f0e"/>
    <rect y="30" width="1088" height="24" fill="#0f1f0e"/>
    <line x1="0" y1="54" x2="1088" y2="54" stroke="#31572c" stroke-width="1"/>
    <circle cx="28" cy="27" r="6.5" fill="#e06c75" opacity="0.85"/>
    <circle cx="50" cy="27" r="6.5" fill="#e5c07b" opacity="0.85"/>
    <circle cx="72" cy="27" r="6.5" fill="#6a994e" opacity="0.95"/>

    <!-- URL Pill -->
    <rect x="104" y="13" width="490" height="28" rx="14" fill="#1b3318" stroke="#4f772d" stroke-opacity="0.6"/>
    <circle cx="122" cy="27" r="4.5" fill="#80b918"/>
    <text x="136" y="32" font-family="monospace" font-size="13" font-weight="600" fill="#d9ed92">https://dpp.example.invalid/de/dpp/pflichtenfinder</text>

    <!-- Status Badge -->
    <rect x="860" y="13" width="204" height="28" rx="14" fill="#244220" stroke="#90a955" stroke-opacity="0.6"/>
    <text x="962" y="31" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#c5e4a0" letter-spacing="0.8">ISO/IEC 18004 · GS1</text>

    <!-- Header Area inside Cockpit -->
    <text x="40" y="96" font-family="monospace" font-size="12" font-weight="700" fill="#90a955" letter-spacing="2">✦ GS1 DIGITAL LINK · STATION 8</text>
    <text x="40" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#f8faf5" letter-spacing="-0.6">Ein einziger QR-Code für Kundschaft, Werkstatt & Zoll</text>
    <text x="40" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#c5e4a0" opacity="0.9">Kompakte URI (< 60 Zeichen) verbindet GTIN, Charge und Seriennummer mit dem Produktpass</text>

    <!-- Main Content Body -->
    <g transform="translate(40, 184)">
      
  <rect width="1008" height="360" rx="16" fill="url(#cardBg)" stroke="#c6d4bc" stroke-width="1.5"/>
  <g transform="translate(28, 28)">
    <rect width="620" height="304" rx="14" fill="#ffffff" stroke="#c6d4bc"/>
    <text x="24" y="34" font-family="monospace" font-size="11.5" font-weight="700" fill="#4f772d">GS1 DIGITAL LINK SYNTAX (ISO/IEC 18004 &amp; DATAMATRIX)</text>
    <rect x="24" y="52" width="572" height="48" rx="10" fill="#162b14"/>
    <text x="40" y="81" font-family="monospace" font-size="13.5" font-weight="700" fill="#c5e4a0">https://id.example.invalid/01/09012345678903/21/ECV-3000</text>

    <g transform="translate(24, 120)">
      <rect width="178" height="90" rx="10" fill="#f2f9ea" stroke="#90a955"/>
      <text x="14" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#4f772d">AI (01) · GTIN-14</text>
      <text x="14" y="52" font-family="monospace" font-size="16" font-weight="700" fill="#1a2117">09012345678903</text>
      <text x="14" y="74" font-family="system-ui, sans-serif" font-size="11.5" fill="#44513e">Globale Modell-ID</text>

      <rect x="196" width="178" height="90" rx="10" fill="#f2f9ea" stroke="#90a955"/>
      <text x="210" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#4f772d">AI (10) · CHARGE/LOS</text>
      <text x="210" y="52" font-family="monospace" font-size="16" font-weight="700" fill="#1a2117">LOT-2027-AT</text>
      <text x="210" y="74" font-family="system-ui, sans-serif" font-size="11.5" fill="#44513e">Produktionscharge</text>

      <rect x="392" width="180" height="90" rx="10" fill="#e1f2ce" stroke="#4f772d"/>
      <text x="406" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#162b14">AI (21) · SERIEN-NR.</text>
      <text x="406" y="52" font-family="monospace" font-size="16" font-weight="700" fill="#162b14">ECV-3000-01</text>
      <text x="406" y="74" font-family="system-ui, sans-serif" font-size="11.5" fill="#244220">Einzelstück-Unikat</text>
    </g>

    <rect x="24" y="232" width="572" height="48" rx="10" fill="#eef3ea"/>
    <text x="40" y="261" font-family="monospace" font-size="12" font-weight="700" fill="#244220">✓ URI-Länge: 56 Zeichen · Optimiert für Lasergravur (29×29 QR-Matrix)</text>
  </g>
  <g transform="translate(672, 28)">
    <rect width="308" height="304" rx="14" fill="#162b14" stroke="#4f772d"/>
    <rect x="64" y="28" width="180" height="180" rx="14" fill="#ffffff"/>
    <!-- Stylized QR Matrix -->
    <rect x="80" y="44" width="42" height="42" fill="none" stroke="#162b14" stroke-width="6"/>
    <rect x="92" y="56" width="18" height="18" fill="#162b14"/>
    <rect x="186" y="44" width="42" height="42" fill="none" stroke="#162b14" stroke-width="6"/>
    <rect x="198" y="56" width="18" height="18" fill="#162b14"/>
    <rect x="80" y="150" width="42" height="42" fill="none" stroke="#162b14" stroke-width="6"/>
    <rect x="92" y="162" width="18" height="18" fill="#162b14"/>
    <rect x="136" y="48" width="12" height="12" fill="#4f772d"/>
    <rect x="156" y="64" width="16" height="16" fill="#162b14"/>
    <rect x="134" y="96" width="38" height="38" rx="6" fill="#31572c"/>
    <text x="153" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#c5e4a0">DPP</text>
    <rect x="186" y="138" width="18" height="18" fill="#162b14"/>
    <rect x="142" y="164" width="24" height="24" fill="#4f772d"/>
    <rect x="192" y="168" width="28" height="24" fill="#162b14"/>
    <text x="154" y="242" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#c5e4a0">SCAN MIT SMARTPHONE &amp; ZOLL</text>
    <text x="154" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e1f2ce">Content-Negotiation: HTML / JSON-LD</text>
  </g>

    </g>
  </g>
</svg>