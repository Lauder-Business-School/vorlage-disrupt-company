  <text x="44" y="94" font-family="monospace" font-size="12.5" fill="#80b918">"@context": "https://dpp.example.invalid/ns/v1",</text>
  <text x="44" y="120" font-family="monospace" font-size="12.5" fill="#e1f2ce">"@id": "did:oyd:z6Mkr9f86d081884c7d65",</text>
  <text x="44" y="146" font-family="monospace" font-size="12.5" fill="#e1f2ce">"passportUid": "ATDEMODEMO0002",</text>
  <text x="44" y="172" font-family="monospace" font-size="12.5" fill="#e1f2ce">"gtin": "09012345678903",</text>
  <text x="44" y="198" font-family="monospace" font-size="12.5" fill="#e1f2ce">"batteryCategory": "EV_TRACTION",</text>
  <text x="44" y="224" font-family="monospace" font-size="12.5" fill="#d9ed92">"carbonFootprintKgPerKwh": 64.2,</text>
  <text x="44" y="250" font-family="monospace" font-size="12.5" fill="#d9ed92">"recycledContent": { "Co": 16.0, "Li": 8.0 },</text>
  <text x="44" y="276" font-family="monospace" font-size="12.5" fill="#d9ed92">"stateOfHealthPercent": 96.4,</text>
