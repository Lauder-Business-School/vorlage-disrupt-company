    <text x="44" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#244220">did:oyd aufgelöst via oydid.example.invalid (200 OK)</text>

    <rect x="26" y="294" width="444" height="42" rx="10" fill="#162b14"/>
    <text x="248" y="320" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#c5e4a0">DPPLINT.OWNYOURDATA.EU · READY FOR REGISTRY</text>
  </g>

    </g>
  </g>
