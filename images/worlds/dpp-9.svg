<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112210"/>
      <stop offset="52%" stop-color="#1d381a"/>
      <stop offset="100%" stop-color="#2f562a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#90a955" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#90a955" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#4f772d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#162b14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
