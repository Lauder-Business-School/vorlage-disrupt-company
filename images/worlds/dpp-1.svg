    <text x="47" y="101" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#162b14">#089</text>
    <text x="96" y="96" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a2117">Demontage- &amp; Entladeanleitung + Explosionszeichnung</text>
    <text x="96" y="115" font-family="monospace" font-size="11" fill="#5c6b57">Rechtsquelle: BattVO Anhang XIII Nr. 2 · Format: PDF/CAD + Drehmomente</text>
    <rect x="760" y="83" width="184" height="28" rx="14" fill="#d6e6c3"/>
    <text x="852" y="101" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#162b14">STUFE 2 · FACHBETRIEB</text>

    <rect y="136" width="960" height="58" rx="10" fill="#ffffff" stroke="#c6d4bc"/>
    <rect x="14" y="151" width="66" height="28" rx="6" fill="#8fb359"/>
    <text x="47" y="169" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#112210">#142</text>
    <text x="96" y="164" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a2117">Prüfberichte der Konformitätsbewertung (UN 38.3)</text>
    <text x="96" y="183" font-family="monospace" font-size="11" fill="#5c6b57">Rechtsquelle: BattVO Anhang XIII Nr. 3 · Zugriff: Notifizierte Stellen</text>
    <rect x="760" y="151" width="184" height="28" rx="14" fill="#8fb359"/>
    <text x="852" y="169" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#112210">STUFE 3 · PRÜFSTELLE</text>

    <rect y="204" width="960" height="58" rx="10" fill="#ffffff" stroke="#c6d4bc"/>
