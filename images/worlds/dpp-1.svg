    <text x="962" y="31" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#c5e4a0" letter-spacing="0.8">211 FELDER · CORS LIVE</text>

    <!-- Header Area inside Cockpit -->
    <text x="40" y="96" font-family="monospace" font-size="12" font-weight="700" fill="#90a955" letter-spacing="2">✦ 211-FELDER-KATALOG · STATION 3 & 4</text>
    <text x="40" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#f8faf5" letter-spacing="-0.6">Der vollständige EU-Datenkatalog mit 4 Zugriffsstufen</text>
    <text x="40" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#c5e4a0" opacity="0.9">Von öffentlichem CO₂-Wert bis zu geschützten Rezepturen für Marktüberwachungsbehörden</text>

    <!-- Main Content Body -->
    <g transform="translate(40, 184)">
      
  <rect width="1008" height="360" rx="16" fill="url(#cardBg)" stroke="#c6d4bc" stroke-width="1.5"/>
  <g transform="translate(24, 22)">
