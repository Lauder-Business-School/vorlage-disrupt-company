    <text x="47" y="237" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#c5e4a0">#198</text>
    <text x="96" y="232" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a2117">Exakte Elektroden- &amp; Elektrolyt-Rezeptur (Massen-%)</text>
    <text x="96" y="251" font-family="monospace" font-size="11" fill="#5c6b57">Rechtsquelle: BattVO Anhang XIII Nr. 4 · Geschäftsgeheimnis geschützt</text>
    <rect x="760" y="219" width="184" height="28" rx="14" fill="#162b14"/>
    <text x="852" y="237" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#c5e4a0">STUFE 4 · BEHÖRDE</text>
