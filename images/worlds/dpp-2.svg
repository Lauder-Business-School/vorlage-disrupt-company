    <text x="40" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#f8faf5" letter-spacing="-0.6">Welche EU-Pflicht gilt ab wann für Ihr Produkt?</text>
    <text x="40" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#c5e4a0" opacity="0.9">Interaktiver Entscheidungsbaum nach ESPR, Batterieverordnung & Bauprodukte-VO</text>

    <!-- Main Content Body -->
    <g transform="translate(40, 184)">
      
  <rect width="1008" height="360" rx="16" fill="url(#cardBg)" stroke="#c6d4bc" stroke-width="1.5"/>
