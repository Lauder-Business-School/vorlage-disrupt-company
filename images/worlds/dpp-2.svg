    <text x="962" y="31" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#c5e4a0" letter-spacing="0.8">200 OK · FRAGEBAUM</text>

    <!-- Header Area inside Cockpit -->
