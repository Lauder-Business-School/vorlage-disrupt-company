    <text x="32" y="109" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#162b14">✓ Stichtag: 18. Februar 2027</text>
    <rect x="20" y="132" width="256" height="36" rx="8" fill="#f1f5ec"/>
    <text x="32" y="155" font-family="system-ui, sans-serif" font-size="13" fill="#44513e">Textilien &amp; Eisen/Stahl: 2027/28</text>
    <rect x="20" y="178" width="256" height="36" rx="8" fill="#f1f5ec"/>
    <text x="32" y="201" font-family="system-ui, sans-serif" font-size="13" fill="#44513e">Möbel, Reifen, Elektronik: 2028–30</text>

    <rect x="328" width="296" height="266" rx="14" fill="#ffffff" stroke="#90a955" stroke-width="1.5"/>
    <text x="348" y="34" font-family="monospace" font-size="11" font-weight="700" fill="#4f772d">SCHRITT 2 · ROLLE &amp; GRANULARITÄT</text>
    <text x="348" y="64" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1a2117">Inverkehrbringer (Art. 77)</text>
    <rect x="348" y="86" width="256" height="52" rx="8" fill="#e1f2ce"/>
    <text x="360" y="108" font-family="monospace" font-size="11" font-weight="700" fill="#162b14">SERIENNUMMER-EBENE (ITEM)</text>
    <text x="360" y="126" font-family="system-ui, sans-serif" font-size="12" fill="#244220">Jede Batterie erhält eigene UID</text>
    <rect x="348" y="150" width="256" height="92" rx="8" fill="#f1f5ec"/>
    <text x="360" y="174" font-family="monospace" font-size="11" font-weight="700" fill="#4f772d">DYNAMISCHE FELDER</text>
    <text x="360" y="196" font-family="system-ui, sans-serif" font-size="12.5" fill="#44513e">• State of Health (SOH) &amp; Zyklen</text>
    <text x="360" y="216" font-family="system-ui, sans-serif" font-size="12.5" fill="#44513e">• Reparatur- &amp; Second-Life-Events</text>

    <rect x="656" width="296" height="266" rx="14" fill="#162b14" stroke="#4f772d" stroke-width="1.5"/>
    <text x="676" y="34" font-family="monospace" font-size="11" font-weight="700" fill="#c5e4a0">SCHRITT 3 · ERGEBNIS-PROFIL</text>
    <text x="676" y="64" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">90 Pflichtfelder aktiv</text>
    <text x="676" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#e1f2ce">Anhang XIII (Kategorien A–D):</text>
    <text x="676" y="122" font-family="monospace" font-size="12" fill="#c5e4a0">• 38 Felder Stufe 1 (Öffentlich)</text>
    <text x="676" y="148" font-family="monospace" font-size="12" fill="#c5e4a0">• 26 Felder Stufe 2 (Berechtigte)</text>
    <text x="676" y="174" font-family="monospace" font-size="12" fill="#c5e4a0">• 12 Felder Stufe 3 (Prüfstelle)</text>
    <text x="676" y="200" font-family="monospace" font-size="12" fill="#c5e4a0">• 14 Felder Stufe 4 (Behörde)</text>
    <rect x="676" y="220" width="256" height="30" rx="8" fill="#4f772d"/>
    <text x="804" y="240" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">DIREKT IN DPP-ENGINE ÖFFNEN ↗</text>
  </g>

    </g>
  </g>
</svg>